<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found | AI for Small Businesses</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --gold:#D4A55A; --dark:#3A2C20; --muted:#9A8870; --bg:#FDFAF4; --bg-alt:#F0E8D4; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px; background:var(--bg); color:var(--dark); font-family:'Manrope', system-ui, sans-serif; text-align:center; }
  main { max-width:520px; }
  .code { font-size:14px; font-weight:600; letter-spacing:.2em; color:#8A5D2B; margin:0 0 12px; }
  h1 { font-size:clamp(28px,6vw,40px); font-weight:800; line-height:1.15; margin:0 0 16px; }
  p { font-size:17px; line-height:1.6; margin:0 0 28px; color:#5A4A3A; }
  .links { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; }
  a { display:inline-block; padding:14px 24px; border-radius:999px; font-weight:600; text-decoration:none; font-size:16px; }
  .primary { background:var(--dark); color:var(--bg); }
  .secondary { border:1.5px solid var(--dark); color:var(--dark); }
  a:focus-visible { outline:3px solid var(--gold); outline-offset:3px; }
</style>
</head>
<body>
<main>
  <p class="code">404</p>
  <h1>That page isn't here.</h1>
  <p>The link may be old or mistyped. Here is where to go instead.</p>
  <div class="links">
    <a class="primary" href="/">Go to the homepage</a>
    <a class="secondary" href="/resources/">Browse free AI resources</a>
  </div>
</main>
</body>
</html>
